name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract Android installers
        shell: bash
        run: |
          shopt -s nullglob
          for archive in release-assets/*/DeepShart-android.zip; do
            ver="$(basename "$(dirname "$archive")")"
            mkdir -p "docs/downloads/$ver"
            unzip -p "$archive" DeepShart-android.apk > "docs/downloads/$ver/DeepShart-android.apk"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
